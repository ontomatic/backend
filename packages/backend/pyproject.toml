[project]
name = "backend"
version = "0.1.0"
dependencies = [
  "alembic>=1.20.0",
  "argon2-cffi>=25.1.0",
  "fastapi>=0.146.0",
  "langchain>=1.4.6",
  "langchain-anthropic>=1.7.6",
  "langfuse>=5.0.2",
  "pdfplumber>=0.11.10",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.0",
  "pyjwt>=2.15.1",
  "sqlalchemy>=2.1.5",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
