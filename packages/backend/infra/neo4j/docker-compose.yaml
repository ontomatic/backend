services:
  neo4j:
    image: neo4j:5.26-community
    profiles: [graph]
    restart: unless-stopped
    ports:
      - '127.0.0.1:7474:7474'
      - '127.0.0.1:7687:7687'
    environment:
      NEO4J_AUTH: 'neo4j/${NEO4J_PASSWORD:-change-me-local-only}'
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
