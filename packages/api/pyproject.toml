[project]
name = "api"
version = "0.1.0"
dependencies = [
  "alembic>=1.20.0",
  "fastapi>=0.146.0",
  "pdfplumber>=0.11.10",
  "psycopg>=3.3.6",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.0",
  "sqlalchemy>=2.1.5",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
